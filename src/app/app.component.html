<div #root class="invite-root">
  <canvas class="app-1" data-petals></canvas>
  <div class="app-2" data-sparkle></div>
  @if (showEnvelope) {
    <app-envelope (tapped)="onEnvelopeTap()" (open)="openInvite()"></app-envelope>
  }
  <app-nav></app-nav>
  <app-music-button (toggle)="toggleMusic()"></app-music-button>
  <app-hero></app-hero>
  <app-countdown></app-countdown>
  <app-memories></app-memories>
  <app-couple></app-couple>
  <app-rsvp [sent]="sent" (submitted)="submitRsvp($event)"></app-rsvp>
  <app-events></app-events>
  <app-awaiting></app-awaiting>
  <app-families></app-families>
  <app-venue></app-venue>
  <app-footer></app-footer>
</div>
